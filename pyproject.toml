[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'scholarly-manuscript-revision-agent'
version = '0.6.0'
description = 'Deterministic source-grounded scholarly manuscript revision workflows'
requires-python = '>=3.11'
dependencies = [
    'jsonschema>=4.23,<5',
    'openpyxl>=3.1,<4',
    'pydantic>=2.0,<3',
    'python-docx>=1.1,<2',
    'PyYAML>=6.0,<7',
    'streamlit>=1.57,<2',
]

[project.optional-dependencies]
dev = [
    'pytest>=8,<10',
]

[tool.setuptools]
package-dir = {'' = 'src'}

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-ra'
